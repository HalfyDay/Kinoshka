org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.vfs.watch=false
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
android.dexOptions.javaMaxHeapSize=4g
# Иерархия source set'ов в :shared задаётся вручную (jvmShared между commonMain и обоими JVM-таргетами).
kotlin.mpp.applyDefaultHierarchyTemplate=false
# hotRun в CMP 1.12 запускается на JetBrains Runtime; разрешаем плагину скачать его самому.
compose.reload.jbr.autoProvisioningEnabled=true
